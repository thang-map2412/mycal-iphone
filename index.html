<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16a34a"><title>MyCal</title>
<style>
:root{--bg:#f4f6f5;--cd:#fff;--tx:#14201a;--mu:#6b7a72;--ln:#e3e9e5;--pri:#16a34a;--red:#dc2626;--bl:#2563eb;--or:#ea580c;--pu:#9333ea;--in:#f0f3f1}
[data-theme=dark]{--bg:#0f1512;--cd:#19211d;--tx:#e8f0ec;--mu:#92a39a;--ln:#2a352f;--pri:#34d17a;--red:#f87171;--bl:#60a5fa;--or:#fb923c;--pu:#c084fc;--in:#222d27}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif;padding-bottom:76px}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;position:sticky;top:0;background:var(--bg);z-index:5}header b{font-size:20px;color:var(--pri)}
main{padding:0 12px;max-width:560px;margin:auto}.card{background:var(--cd);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 1px 3px #0001}
h3{margin:0 0 8px;font-size:16px}p{margin:6px 0}.mu{color:var(--mu);font-size:13px}.row{display:flex;gap:12px;align-items:center}.sp{justify-content:space-between}
input,select{width:100%;padding:11px;border:1px solid var(--ln);border-radius:10px;background:var(--in);color:var(--tx);font:inherit;min-height:44px}label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn,.sm{border:0;border-radius:10px;background:var(--pri);color:#fff;font:inherit;font-weight:600;padding:11px 14px;min-height:44px;cursor:pointer}.sm{padding:6px 10px;min-height:36px;background:var(--in);color:var(--tx);font-weight:500}.btn.o{background:var(--in);color:var(--tx)}.btn.d{background:var(--red)}.btn.w{width:100%;margin-top:10px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--cd);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);z-index:6}nav button{flex:1;border:0;background:none;color:var(--mu);padding:8px 0;font:11px system-ui;min-height:56px}nav button span{display:block;font-size:20px}nav .on{color:var(--pri);font-weight:700}
.dn{display:flex;gap:6px;margin:6px 0}.dn input{flex:1}.dn button{min-width:44px}
.rb{fill:none;stroke:var(--in);stroke-width:12}.rf{fill:none;stroke-width:12;stroke-linecap:round}.rt{font:700 22px system-ui;fill:var(--tx)}.rs{font:10px system-ui;fill:var(--mu)}
.bar{height:8px;background:var(--in);border-radius:5px;overflow:hidden;margin:3px 0 8px}.bar i{display:block;height:100%;border-radius:5px}
.it{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--ln)}.it:first-of-type{border:0}.it div:first-child{flex:1;min-width:0}
.empty{color:var(--mu);text-align:center;padding:14px;font-size:13px}.warn{background:#fef3c7;color:#78350f;border-radius:10px;padding:9px;font-size:13px;margin:8px 0}[data-theme=dark] .warn{background:#3d3210;color:#fde68a}.bad{background:#fee2e2;color:#7f1d1d}[data-theme=dark] .bad{background:#401818;color:#fecaca}
.tabs{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}.tabs button{flex:1;min-width:60px;border:1px solid var(--ln);background:var(--cd);color:var(--tx);border-radius:20px;padding:8px;font:inherit;min-height:40px}.tabs .on{background:var(--pri);color:#fff;border-color:var(--pri)}
.ch{width:100%;height:auto}.gl{stroke:var(--ln)}.ax{font:9px system-ui;fill:var(--mu)}
#mo{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:20}#mo.on{display:flex}#mb{background:var(--cd);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px 24px}
#ts{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;z-index:30;display:none;max-width:90%;font-size:14px}#ts.e{background:var(--red)}
.res button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--ln);background:none;color:var(--tx);padding:9px 4px;font:inherit}.fav{color:#eab308!important;font-size:20px}.chip{display:inline-block;background:var(--in);border-radius:12px;padding:1px 7px;font-size:11px;color:var(--mu)}.dobgrid{display:grid;grid-template-columns:1fr 1.3fr 1.5fr;gap:7px}.bulkarea{width:100%;min-height:190px;padding:11px;border:1px solid var(--ln);border-radius:10px;background:var(--in);color:var(--tx);font:13px/1.45 ui-monospace,monospace;resize:vertical}.preview{max-height:220px;overflow:auto;border:1px solid var(--ln);border-radius:10px;padding:8px;font-size:12px}.preview div{padding:5px 0;border-bottom:1px solid var(--ln)}
</style></head><body>
<header><b>MyCal</b><button class="sm" onclick="togTheme()" aria-label="Sáng/tối">🌓</button></header>
<main id="main"></main>
<nav id="nav"></nav><div id="mo" onclick="if(event.target==this)closeM()"><div id="mb"></div></div><div id="ts"></div>
<script>
'use strict';
const KEY='mycal_v1',$=s=>document.querySelector(s);
const fmt=n=>isFinite(n)?Math.round(n).toLocaleString('vi-VN'):'–',f1=n=>isFinite(n)?(Math.round(n*10)/10).toLocaleString('vi-VN'):'–';
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Ho_Chi_Minh'}).format(new Date());
const addD=(d,n)=>{const t=new Date(d+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)};
const dL=d=>d.slice(8)+'/'+d.slice(5,7),uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const x=parseFloat(String(v).trim().replace(',','.'));return isFinite(x)?x:NaN};
const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').toLowerCase();
const isD=s=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;const d=new Date(s+'T00:00:00Z');return !isNaN(d)&&d.toISOString().slice(0,10)===s};
const ACT=[[1.2,'Ít vận động (công việc chủ yếu ngồi)'],[1.375,'Nhẹ (đi lại nhẹ trong ngày)'],[1.55,'Vừa (đi lại/đứng khá nhiều)'],[1.725,'Cao (lao động thể lực, đứng/đi nhiều)']];
const MEALS=[['sang','Bữa sáng','🌅'],['trua','Bữa trưa','☀️'],['toi','Bữa tối','🌙'],['phu','Bữa phụ','🍎']];
const MET={gym:[3.5,5,6],cardio:[4.5,7,10]},INT=['Nhẹ','Vừa','Nặng'];
function seed(){return [['Cơm trắng','chín',130,2.7,28,.3],['Gạo tẻ','sống',360,7,79,.6],['Bún tươi','chín',110,1.7,25,.2],['Yến mạch','sống',380,13,68,7],['Bánh mì trắng','',265,9,49,3.2],['Khoai lang','sống',86,1.6,20,.1],['Khoai tây','sống',77,2,17,.1],['Ức gà','sống',120,22.5,0,2.6],['Ức gà','chín',165,31,0,3.6],['Thịt heo nạc','sống',143,21,0,6],['Thịt bò nạc','sống',150,21,0,7],['Cá hồi','sống',208,20,0,13],['Cá basa','sống',92,15,0,3],['Tôm','sống',85,18,0,1],['Trứng gà','',143,12.6,.7,9.5,['quả',50]],['Đậu phụ','',76,8,1.9,4.8],['Sữa tươi không đường','',61,3.2,4.8,3.3],['Sữa chua không đường','',61,3.5,4.7,3.3],['Chuối','',89,1.1,23,.3,['quả',100]],['Táo','',52,.3,14,.2],['Cam','',47,.9,12,.1],['Bông cải xanh','sống',34,2.8,7,.4],['Cà chua','',18,.9,3.9,.2],['Rau cải xanh','sống',20,2,3,.3],['Dầu ăn','',884,0,0,100],['Bơ đậu phộng','',588,25,20,50],['Hạt hạnh nhân','',579,21,22,50],['Đường','',387,0,100,0]].map((a,i)=>({id:'b'+i,name:a[0],st:a[1],k:a[2],p:a[3],c:a[4],f:a[5],sv:a[6]?{n:a[6][0],g:a[6][1]}:null,fav:false}))}
const D0=()=>({v:1,p:{sex:'m',dob:'',h:'',w:'',act:1.2,goal:'lose',tw:'',mode:'tdee',delta:-300,direct:1650,tdeeM:null,tdeeMethod:'mifflin',bf:'',stepsOn:false,stepBase:null},mac:{p:'',c:'',f:''},foods:seed(),log:{},steps:{},wk:{},wt:{},customCardio:[],dark:null});
function merge(r){const d=D0(),p=Object.assign(d.p,r.p||{});if(p.dob&&/^\d{4}-\d{2}-\d{2}$/.test(p.dob))p.dob=p.dob.slice(0,4);return Object.assign(d,r,{p,mac:Object.assign(d.mac,r.mac),customCardio:Array.isArray(r.customCardio)?r.customCardio:[]})}
let S;try{const r=JSON.parse(localStorage.getItem(KEY));S=r&&r.v==1?merge(r):D0()}catch(e){S=D0()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Không lưu được dữ liệu (bộ nhớ đầy hoặc bị chặn)',1)}};
// ===== TÍNH TOÁN =====
const wOn=d=>{const k=Object.keys(S.wt).sort();let r=null;for(const x of k)if(x<=d)r=x;if(r==null&&k.length)r=k[0];return r?S.wt[r]:num(S.p.w)};
const curW=()=>wOn('9999-12-31');
const age=y=>{const n=+today().slice(0,4),v=+y;return v>=1900&&v<=n?n-v:NaN};
function bmr(){const p=S.p,w=curW(),a=age(p.dob),h=+p.h;if(!(w>0&&h>0&&a>=10&&a<=100))return NaN;if(p.tdeeMethod==='katch'){const bf=+p.bf;if(!(bf>2&&bf<70))return NaN;return 370+21.6*w*(1-bf/100)}return 10*w+6.25*h-5*a+(p.sex=='m'?5:-161)}
const tdeeAuto=()=>bmr()*S.p.act,tdee=()=>S.p.tdeeM>0?S.p.tdeeM:tdeeAuto();
const target=()=>S.p.mode=='direct'?(S.p.direct>0?+S.p.direct:NaN):tdee()+(+S.p.delta||0);
const mG=()=>({p:+S.mac.p||0,c:+S.mac.c||0,f:+S.mac.f||0});
const stepK=()=>0;
const wkK=(x,w)=>w>0?(x.rateKcal>0&&x.rateMin>0?x.rateKcal/x.rateMin*x.min:Math.max(0,(MET[x.kind][x.int]-1)*w*x.min/60)):0;
function dayTot(d){const t={k:0,p:0,c:0,f:0,n:0};for(const e of S.log[d]||[]){t.k+=e.k;t.p+=e.p||0;t.c+=e.c||0;t.f+=e.f||0;t.n++}return t}
function dayAct(d){const w=wOn(d),st=S.steps[d],ws=S.wk[d]||[],sk=0,wk=ws.reduce((a,x)=>a+wkK(x,w),0);return{st,sk:0,wk,tot:wk,ws,w}}
function trend(ds){const pts=ds.map((d,i)=>S.wt[d]!=null?[i,S.wt[d]]:null).filter(Boolean);if(pts.length<2||pts[pts.length-1][0]-pts[0][0]<3)return NaN;const n=pts.length,sx=pts.reduce((a,p)=>a+p[0],0),sy=pts.reduce((a,p)=>a+p[1],0),sxy=pts.reduce((a,p)=>a+p[0]*p[1],0),sxx=pts.reduce((a,p)=>a+p[0]*p[0],0),dn=n*sxx-sx*sx;return dn?(n*sxy-sx*sy)/dn*7:NaN}
function suggestMac(){const w=curW(),tg=target();if(!(w>0&&tg>0))return null;const p=Math.round(w*1.8),f=Math.round(w*.9),c=Math.max(0,Math.round((tg-4*p-9*f)/4));return{p,c,f}}
// ===== UI =====
let CUR=today(),TAB='ov',NT='log',ST={r:7,from:'',to:''},LT=today();
function toast(m,e){const t=$('#ts');t.textContent=m;t.className=e?'e':'';t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2400)}
const modal=h=>{$('#mb').innerHTML=h;$('#mo').classList.add('on')},closeM=()=>$('#mo').classList.remove('on');
function applyTheme(){const d=S.dark==null?matchMedia('(prefers-color-scheme:dark)').matches:S.dark;document.documentElement.dataset.theme=d?'dark':'light'}
function togTheme(){S.dark=document.documentElement.dataset.theme!='dark';save();applyTheme()}
const go=t=>{TAB=t;render();scrollTo(0,0)};
function setDay(v){CUR=isD(v)?v:today();render()}const shift=n=>setDay(addD(CUR,n));
const dayNav=()=>`<div class="dn"><button class="sm" onclick="shift(-1)">‹</button><input type="date" value="${CUR}" onchange="setDay(this.value)"><button class="sm" onclick="shift(1)">›</button><button class="sm" onclick="setDay('')">Hôm nay</button></div>`;
function bar(l,v,g,c){const pc=g>0?Math.min(100,v/g*100):0;return `<div class="row sp"><span>${l}</span><span class="mu"><b style="color:var(--tx)">${f1(v)}</b>${g>0?' / '+f1(g)+' g · '+(v>g?'vượt '+f1(v-g):'còn '+f1(g-v)):' g'}</span></div><div class="bar"><i style="width:${pc}%;background:${v>g&&g>0?'var(--red)':c}"></i></div>`}
function modeText(){return S.p.mode=='direct'?'Nhập trực tiếp':`Theo TDEE (${fmt(tdee())} ${S.p.delta<0?'−':'+'} ${fmt(Math.abs(S.p.delta))})`}
function pOv(){const d=CUR,t=dayTot(d),a=dayAct(d),tg=target(),mg=mG();let h=dayNav();
if(!(tg>0))h+=`<div class="card"><b>Chưa có mục tiêu calo</b><p class="mu">Nhập hồ sơ cơ thể và chọn cách đặt mục tiêu (hoặc nhập trực tiếp số kcal).</p><button class="btn" onclick="go('pr')">Mở Hồ sơ</button></div>`;
const over=tg>0&&t.k>tg,pc=tg>0?Math.min(100,t.k/tg*100):0,C=2*Math.PI*52;
h+=`<div class="card"><div class="row"><svg width="130" height="130" viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" class="rb"/><circle cx="60" cy="60" r="52" class="rf" style="stroke:${over?'var(--red)':'var(--pri)'};stroke-dasharray:${C*pc/100} ${C}" transform="rotate(-90 60 60)"/><text x="60" y="60" text-anchor="middle" class="rt">${fmt(tg>0?Math.abs(tg-t.k):t.k)}</text><text x="60" y="76" text-anchor="middle" class="rs">${tg>0?(over?'kcal vượt':'kcal còn lại'):'kcal đã nạp'}</text></svg>
<div><div class="mu">Mục tiêu ăn vào</div><b>${tg>0?fmt(tg)+' kcal':'–'}</b><div class="mu" style="margin-top:6px">Đã nạp</div><b>${fmt(t.k)} kcal</b><div class="mu" style="margin-top:6px">${modeText()}</div></div></div></div>
<div class="card"><h3>Dinh dưỡng</h3>${bar('Protein',t.p,mg.p,'var(--bl)')}${bar('Carbohydrate',t.c,mg.c,'var(--or)')}${bar('Chất béo',t.f,mg.f,'var(--pu)')}${!(mg.p||mg.c||mg.f)?'<p class="mu">Chưa đặt mục tiêu macro (vào Hồ sơ).</p>':''}</div>
<div class="card"><h3>Vận động <span class="chip">ước tính</span></h3><div class="g3"><div><div class="mu">Bước chân</div><b>${a.st!=null?fmt(a.st):'–'}</b></div><div><div class="mu">Calories từ bước</div><b>Không tính</b></div><div><div class="mu">Gym/cardio</div><b>${fmt(a.wk)} kcal</b></div></div>
<p class="mu">Năng lượng Gym/cardio bổ sung: <b style="color:var(--tx)">${fmt(a.wk)} kcal</b>. Số bước chỉ để theo dõi, không quy đổi calories.</p>
${a.ws.length?a.ws.map(x=>`<div class="it"><div>${x.kind=='gym'?'🏋️':'🏃'} ${esc(x.type)}</div><div class="mu">${x.min} phút · ${INT[x.int]}</div></div>`).join(''):'<div class="empty">Chưa ghi hoạt động ngày này</div>'}</div>`;
const lw=wOn(d),ds=[...Array(30)].map((_,i)=>addD(d,i-29)),tr=trend(ds),w7=[...Array(7)].map((_,i)=>addD(d,-i)).filter(x=>dayTot(x).n),av=w7.length?w7.reduce((s,x)=>s+dayTot(x).k,0)/w7.length:NaN;
h+=`<div class="card"><div class="row sp"><h3>Cân nặng</h3><button class="sm" onclick="openWt()">Ghi cân nặng</button></div><b style="font-size:22px">${lw>0?f1(lw)+' kg':'–'}</b> <span class="mu">${S.wt[d]!=null?'(ngày này)':'(gần nhất)'}${S.p.tw>0?' · mục tiêu '+f1(+S.p.tw)+' kg':''}</span></div>
<div class="card"><h3>Xu hướng gần đây</h3><p>Calo nạp TB (7 ngày, ${w7.length} ngày có ghi): <b>${fmt(av)} kcal</b>${tg>0&&isFinite(av)?` · ${av>tg?'cao hơn':'thấp hơn'} mục tiêu ${fmt(Math.abs(av-tg))}`:''}</p><p>Xu hướng cân nặng (30 ngày): <b>${isNaN(tr)?'chưa đủ dữ liệu (cần ≥2 lần cân cách ≥3 ngày)':(tr>0?'+':'')+f1(tr)+' kg/tuần'}</b> <span class="mu">ước tính hồi quy tuyến tính</span></p></div>`;return h}
function openWt(){const w=S.wt[CUR];modal(`<h3>Cân nặng ngày ${dL(CUR)}</h3><label>Cân nặng (kg)</label><input id="wv" inputmode="decimal" value="${w!=null?w:''}"><button class="btn w" onclick="saveWt()">Lưu</button>${w!=null?'<button class="btn d w" onclick="delWt()">Xóa bản ghi ngày này</button>':''}`)}
function saveWt(){const v=num($('#wv').value);if(!(v>=20&&v<=300))return toast('Cân nặng phải từ 20 đến 300 kg',1);S.wt[CUR]=Math.round(v*10)/10;save();closeM();toast('Đã lưu cân nặng');render()}
function delWt(){if(!confirm('Xóa bản ghi cân nặng này?'))return;delete S.wt[CUR];save();closeM();toast('Đã xóa');render()}
function pNu(){const t=dayTot(CUR),tg=target(),mg=mG();let h=dayNav()+`<div class="tabs"><button class="${NT=='log'?'on':''}" onclick="NT='log';render()">Nhật ký</button><button class="${NT=='food'?'on':''}" onclick="NT='food';render()">Thực phẩm</button></div>`;
if(NT=='food')return h+`<input id="fq" placeholder="Tìm thực phẩm…" oninput="fl()"><div class="row" style="margin-top:8px"><label style="margin:0;display:flex;align-items:center;gap:6px"><input id="onlyFav" type="checkbox" style="width:20px;min-height:20px" onchange="fl()"> Chỉ món yêu thích</label></div><div class="g2"><button class="btn w" onclick="openFood()">+ Tạo thực phẩm</button><button class="btn o w" onclick="openBulkFoods()">⇧ Nhập hàng loạt</button></div><div class="card" id="fl"></div><p class="mu">Giá trị có sẵn là số tham khảo gần đúng trên 100 g, hãy đối chiếu nhãn sản phẩm và sửa nếu cần. Thực phẩm sống/chín có giá trị khác nhau, hãy chọn đúng loại khi cân.</p>`;
h+=`<div class="card"><div class="row sp"><h3>Tổng hợp</h3><button class="sm" onclick="openQuickCal()">⚡ Nhập calo nhanh</button></div><div class="row sp"><span>Kcal</span><b>${fmt(t.k)}${tg>0?' / '+fmt(tg)+' ('+(t.k>tg?'vượt '+fmt(t.k-tg):'còn '+fmt(tg-t.k))+')':''}</b></div>${bar('Protein',t.p,mg.p,'var(--bl)')}${bar('Carbohydrate',t.c,mg.c,'var(--or)')}${bar('Chất béo',t.f,mg.f,'var(--pu)')}</div>`;
for(const[id,nm,ic]of MEALS){const es=(S.log[CUR]||[]).filter(e=>e.meal==id),k=es.reduce((s,e)=>s+e.k,0);
h+=`<div class="card"><div class="row sp"><h3>${ic} ${nm} · ${fmt(k)} kcal</h3><button class="sm" onclick="openEntry('${id}')">+ Thêm</button></div>${es.length?es.map(e=>`<div class="it"><div onclick="${e.quick?`openQuickCal('${e.id}')`:`openEntry('${id}','${e.id}')`}"><b>${esc(e.name)}</b><div class="mu">${e.g?f1(e.g)+' g · ':''}${fmt(e.k)} kcal · P ${e.p==null?'–':f1(e.p)} · C ${e.c==null?'–':f1(e.c)} · F ${e.f==null?'–':f1(e.f)}${e.quick?' · ⚡':''}${e.note?'<br>📝 '+esc(e.note):''}</div></div><button class="sm" onclick="delEntry('${e.id}')">🗑</button></div>`).join(''):'<div class="empty">Chưa có món nào</div>'}</div>`}return h}

function parseBulkFoods(){
 const raw=$('#bulkText').value.trim();if(!raw)return {rows:[],errors:['Chưa có dữ liệu để nhập']};
 const lines=raw.split(/\r?\n/).filter(x=>x.trim()),rows=[],errors=[];
 lines.forEach((line,i)=>{
  let a=line.includes('\t')?line.split('\t'):line.split(';');a=a.map(x=>x.trim());
  if(i===0&&/^(tên(?: thực phẩm)?|ten(?: thuc pham)?|name)$/i.test((a[0]||'').replace(/^\uFEFF/,'')))return;
  if(a.length<6){errors.push(`Dòng ${i+1}: cần ít nhất 6 cột (tên, dạng, kcal, protein, carb, fat)`);return;}
  const name=(a[0]||'').replace(/^\uFEFF/,'').trim(),st=(a[1]||'').toLowerCase(),k=num(a[2]),pr=num(a[3]),c=num(a[4]),f=num(a[5]);
  if(!name){errors.push(`Dòng ${i+1}: thiếu tên thực phẩm`);return;}
  if(st&&!['sống','chín'].includes(st)){errors.push(`Dòng ${i+1}: dạng phải là sống, chín hoặc để trống`);return;}
  if(!(k>=0&&pr>=0&&c>=0&&f>=0)){errors.push(`Dòng ${i+1}: kcal và macro phải là số không âm`);return;}
  const sn=a[6]||'',sg=a[7]?num(a[7]):NaN;
  if(sn&&!(sg>0)){errors.push(`Dòng ${i+1}: có đơn vị khẩu phần nhưng gram/đơn vị không hợp lệ`);return;}
  rows.push({name,st,k,p:pr,c,f,sv:sn?{n:sn,g:sg}:null,line:i+1});
 });
 return {rows,errors};
}

function previewBulkFoods(){
 const {rows,errors}=parseBulkFoods();BULK_ROWS=rows;const mode=$('#bulkMode').value,seen=new Set(),counts={add:0,update:0,skip:0};
 rows.forEach(r=>{const key=norm(r.name)+'|'+r.st;if(seen.has(key)){counts.skip++;return}seen.add(key);const found=S.foods.some(f=>norm(f.name)+'|'+(f.st||'')===key);if(found){if(mode==='update')counts.update++;else counts.skip++}else counts.add++});
 const box=$('#bulkPreview');box.innerHTML=`<div class="card"><b>Kết quả kiểm tra</b><p>Hợp lệ: ${rows.length} dòng · Thêm mới: ${counts.add} · Cập nhật: ${counts.update} · Bỏ qua do trùng trong kho/danh sách: ${counts.skip}</p>${errors.length?`<div class="warn">${errors.map(esc).join('<br>')}</div>`:''}${rows.length?`<div class="preview">${rows.slice(0,12).map(r=>`<div><b>${esc(r.name)}</b> ${r.st?`(${r.st})`:''} · ${fmt(r.k)} kcal · P ${f1(r.p)} / C ${f1(r.c)} / F ${f1(r.f)}</div>`).join('')}${rows.length>12?`<p class="mu">Còn ${rows.length-12} món…</p>`:''}</div>`:''}</div>`;
 $('#bulkCommit').style.display=rows.length?'block':'none';
}
function commitBulkFoods(){
 const {rows,errors}=parseBulkFoods();if(errors.length){toast('Có dòng chưa hợp lệ, hãy sửa trước khi nhập',1);previewBulkFoods();return}if(!rows.length)return toast('Không có món hợp lệ để nhập',1);
 const mode=$('#bulkMode').value,seen=new Set();let added=0,updated=0,skipped=0;
 rows.forEach(r=>{const key=norm(r.name)+'|'+r.st;if(seen.has(key)){skipped++;return}seen.add(key);const i=S.foods.findIndex(f=>norm(f.name)+'|'+(f.st||'')===key);const o={id:i>=0?S.foods[i].id:uid(),name:r.name,st:r.st,k:r.k,p:r.p,c:r.c,f:r.f,sv:r.sv,fav:i>=0?!!S.foods[i].fav:false};if(i>=0){if(mode==='update'){S.foods[i]=o;updated++}else skipped++}else{S.foods.push(o);added++}});
 save();closeM();toast(`Đã thêm ${added}, cập nhật ${updated}, bỏ qua ${skipped} món`);render();
}

const cv=$('#wCustom').value,custom=cv.startsWith('custom:')?S.customCardio.find(c=>c.id===cv.slice(7)):null;

const L=S.wk[CUR]=S.wk[CUR]||[],i=L.findIndex(y=>y.id==id);i>=0?L[i]=o:L.push(o);save();closeM();toast('Đã lưu hoạt động');render()}
function manageCardio(){modal(`<h3>Loại cardio tự tạo</h3><p class="mu">Khai báo mức calories tham chiếu và thời lượng. Khi ghi hoạt động, MyCal quy đổi calories theo thời lượng thực tế.</p><button class="btn w" onclick="editCustomCardio()">+ Tạo loại cardio</button><div id="customList">${S.customCardio.map(c=>`<div class="it"><div><b>${esc(c.name)}</b><div class="mu">${c.kcal} kcal / ${c.duration} phút</div></div><button class="sm" onclick="editCustomCardio('${c.id}')">Sửa</button><button class="sm" onclick="delCustomCardio('${c.id}')">Xóa</button></div>`).join('')||'<div class="empty">Chưa có loại cardio tự tạo</div>'}</div>`)}
function editCustomCardio(id){const c=id?S.customCardio.find(x=>x.id==id):{name:'',kcal:'',duration:30};modal(`<h3>${id?'Sửa':'Tạo'} loại cardio</h3><label>Tên hoạt động</label><input id="ccN" value="${esc(c.name)}"><div class="g2"><div><label>Calories tham chiếu (kcal)</label><input id="ccK" inputmode="decimal" value="${c.kcal}"></div><div><label>Thời lượng tham chiếu (phút)</label><input id="ccD" inputmode="numeric" value="${c.duration}"></div></div><p class="mu">Ví dụ: Đi bộ nhanh · 150 kcal · 30 phút. Đây là ước tính cá nhân/thiết bị, không phải con số đo chính xác.</p><button class="btn w" onclick="saveCustomCardio('${id||''}')">Lưu loại cardio</button><button class="btn o w" onclick="manageCardio()">Quay lại</button>`)}
function saveCustomCardio(id){const name=$('#ccN').value.trim(),k=num($('#ccK').value),d=num($('#ccD').value);if(!name)return toast('Nhập tên hoạt động',1);if(!(k>0&&k<=3000&&d>0&&d<=600))return toast('Calories hoặc thời lượng tham chiếu không hợp lệ',1);const o={id:id||uid(),name,kcal:k,duration:d},i=S.customCardio.findIndex(x=>x.id==id);if(i>=0)S.customCardio[i]=o;else S.customCardio.push(o);save();manageCardio();toast('Đã lưu loại cardio')}
function delCustomCardio(id){if(!confirm('Xóa loại cardio này khỏi danh sách? Nhật ký hoạt động cũ vẫn được giữ.'))return;S.customCardio=S.customCardio.filter(x=>x.id!==id);save();manageCardio()}
function delWk(id){if(!confirm('Xóa bản ghi này?'))return;S.wk[CUR]=(S.wk[CUR]||[]).filter(x=>x.id!=id);if(!S.wk[CUR].length)delete S.wk[CUR];save();render()}

function chart(dates,series,o={}){const W=340,H=160,L=38,R=8,T=10,B=22,w=W-L-R,h=H-T-B,n=dates.length,all=series.flatMap(s=>s.v).filter(x=>x!=null);
if(!all.length)return'<div class="empty">Chưa có dữ liệu trong khoảng này</div>';
let mx=Math.max(...all,o.ref||0),mn=0;if(o.zero===false){mn=Math.min(...all);const p=(mx-mn)*.2||1;mn-=p;mx+=p}else mx=mx*1.1||1;
const X=i=>o.bar?L+w/n*(i+.5):L+(n==1?w/2:w*i/(n-1)),Y=v=>T+h-(v-mn)/(mx-mn)*h,F=mx-mn<10?f1:fmt;let s=`<svg viewBox="0 0 ${W} ${H}" class="ch">`;
for(let i=0;i<=3;i++){const v=mn+(mx-mn)*i/3,y=Y(v);s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" class="gl"/><text x="${L-4}" y="${y+3}" text-anchor="end" class="ax">${F(v)}</text>`}
if(o.ref>0)s+=`<line x1="${L}" x2="${W-R}" y1="${Y(o.ref)}" y2="${Y(o.ref)}" stroke="var(--red)" stroke-dasharray="4 3"/>`;
for(const sr of series){if(o.bar){const bw=Math.max(1.5,w/n*.7);sr.v.forEach((v,i)=>{if(v!=null)s+=`<rect x="${X(i)-bw/2}" y="${Y(v)}" width="${bw}" height="${Math.max(0,T+h-Y(v))}" fill="${sr.c}" rx="2"/>`})}
else{const pts=sr.v.map((v,i)=>v!=null?[X(i),Y(v)]:null).filter(Boolean);if(pts.length>1)s+=`<polyline fill="none" stroke="${sr.c}" stroke-width="2" points="${pts.map(p=>p.join(',')).join(' ')}"/>`;pts.forEach(p=>s+=`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${sr.c}"/>`)}}
const st=Math.ceil(n/5);dates.forEach((d,i)=>{if(i%st==0)s+=`<text x="${X(i)}" y="${H-6}" text-anchor="middle" class="ax">${dL(d)}</text>`;s+=`<rect x="${o.bar?X(i)-w/n/2:X(i)-8}" y="${T}" width="${o.bar?w/n:16}" height="${h}" fill="transparent" onclick="dayDetail('${d}')"/>`});return s+'</svg>'}
function rng(){let to=ST.r=='c'&&isD(ST.to)?ST.to:today(),fr=ST.r=='c'&&isD(ST.from)?ST.from:addD(to,-(+ST.r||7)+1);if(fr>to)fr=to;if(addD(fr,365)<to)fr=addD(to,-365);const ds=[];for(let d=fr;d<=to;d=addD(d,1))ds.push(d);return ds}

ex=ds.map(d=>{const a=dayAct(d);return a.ws.length?a.wk:null}),bal=ds.map(d=>{const a=dayAct(d),t=dayTot(d);return (has(d)||a.ws.length)&&tdee()>0?Math.round((tdee()+a.wk)-t.k):null}),wt=ds.map(d=>S.wt[d]!=null?S.wt[d]:null),tr=trend(ds),cnt=a=>a.filter(x=>x!=null).length;

${ST.r=='c'?`<div class="g2"><input type="date" value="${ST.from}" onchange="ST.from=this.value;render()"><input type="date" value="${ST.to}" max="${today()}" onchange="ST.to=this.value;render()"></div>`:''}
<p class="mu">${dL(ds[0])} → ${dL(ds[ds.length-1])} · chạm vào cột/điểm để xem chi tiết ngày. Ngày không có dữ liệu để trống, không nội suy.</p>

${C('Xu hướng cân nặng',isNaN(tr)?'Chưa đủ dữ liệu (cần ≥2 lần cân cách nhau ≥3 ngày).':'Ước tính hồi quy tuyến tính trên các ngày có ghi.',`<b style="font-size:20px">${isNaN(tr)?'–':(tr>0?'+':'')+f1(tr)+' kg/tuần'}</b>`)}

${C('Calo nạp vào (kcal)',cnt(kc)+' ngày có ghi nhật ký. Đường đỏ = mục tiêu hiện tại.',chart(ds,[{c:'var(--pri)',v:kc}],{bar:1,ref:tg>0?tg:0}))}
${C('Mức hoàn thành mục tiêu calo (%)',tg>0?'Nạp ÷ mục tiêu hiện tại; đường đỏ = 100%.':'Chưa có mục tiêu calo.',tg>0?chart(ds,[{c:'var(--or)',v:kc.map(k=>k==null?null:Math.round(k/tg*100))}],{bar:1,ref:100}):'')}
${C('Protein / Carb / Fat (g)','<span style="color:var(--bl)">● Protein</span> <span style="color:var(--or)">● Carb</span> <span style="color:var(--pu)">● Fat</span>',chart(ds,[['p','--bl'],['c','--or'],['f','--pu']].map(a=>({c:`var(${a[1]})`,v:ds.map(d=>has(d)?dayTot(d)[a[0]]:null)})),{}))}

function dayDetail(d){const t=dayTot(d),a=dayAct(d),tg=target();modal(`<h3>${d.split('-').reverse().join('/')}</h3><p>Calo nạp: <b>${fmt(t.k)} kcal</b>${tg>0&&t.n?' / '+fmt(tg):''}<br>P ${f1(t.p)} g · C ${f1(t.c)} g · F ${f1(t.f)} g (${t.n} món)</p><p>Cân nặng: <b>${S.wt[d]!=null?f1(S.wt[d])+' kg':'chưa ghi'}</b><br>Bước: <b>${a.st!=null?fmt(a.st):'chưa ghi'}</b> · Gym/cardio bổ sung: <b>${fmt(a.wk)} kcal</b><br>Thâm hụt/thặng dư ước tính: <b>${fmt(tdee()+a.wk-t.k)} kcal</b> (dương = thâm hụt)</p>${a.ws.map(x=>`<p class="mu">${esc(x.type)} · ${x.min} phút · ${INT[x.int]}</p>`).join('')}<button class="btn w" onclick="closeM();CUR='${d}';go('ov')">Mở ngày này</button>`)}

const RULES={h:[100,250],tw:[20,300],delta:[-1500,1500],direct:[800,6000],tdeeM:[800,6000],bf:[2,70]};
function setP(k,v){let x=v;if(k in RULES){if(String(v).trim()==='')x=(k=='tdeeM'||k=='stepBase')?null:'';else{x=num(v);const[a,b]=RULES[k];if(!(x>=a&&x<=b)){toast(`Giá trị không hợp lệ (${a}–${b})`,1);return render()}}}
else if(k=='act')x=+v;else if(k=='dob'&&v){x=String(Math.trunc(num(v)));if(!/^\d{4}$/.test(x)||!(age(x)>=10&&age(x)<=100)){toast('Năm sinh không hợp lệ (độ tuổi 10–100)',1);return render()}}
S.p[k]=x;save();if(['mode','goal','tdeeMethod','dob','bf'].includes(k)||TAB!='pr')render();else refreshCalc();toast('Đã lưu')}
function setM(k,v){if(String(v).trim()==='')S.mac[k]='';else{const x=num(v);if(!(x>=0&&x<=1000)){toast('Giá trị không hợp lệ (0–1000 g)',1);return render()}S.mac[k]=x}save();refreshCalc();toast('Đã lưu')}
function setW(v){const x=num(v);if(!(x>=20&&x<=300)){toast('Cân nặng phải từ 20 đến 300 kg',1);return render()}S.wt[today()]=Math.round(x*10)/10;S.p.w=S.wt[today()];save();refreshCalc();toast('Đã lưu cân nặng hôm nay')}
function useSug(){const s=suggestMac();if(!s)return toast('Cần nhập đủ hồ sơ và mục tiêu calo trước',1);S.mac={p:s.p,c:s.c,f:s.f};save();render();toast('Đã áp dụng gợi ý macro')}
function calcBox(){const b=bmr(),ta=tdeeAuto(),tg=target(),m=mG(),ms=4*m.p+4*m.c+9*m.f;let h=`<p>BMR (${S.p.tdeeMethod==='katch'?'Katch-McArdle':'Mifflin-St Jeor'}, ước tính): <b>${fmt(b)} kcal</b><br>TDEE tự tính (BMR × ${S.p.act}): <b>${fmt(ta)} kcal</b><br>TDEE đang dùng: <b>${fmt(tdee())} kcal</b> ${S.p.tdeeM>0?'<span class="chip">hiệu chỉnh tay</span>':'<span class="chip">tự tính</span>'}<br>Mục tiêu ăn vào: <b>${tg>0?fmt(tg)+' kcal':'–'}</b> <span class="chip">${modeText()}</span></p>`;
if(isNaN(b))h+='<div class="warn">'+(S.p.tdeeMethod==='katch'?'Nhập cân nặng và tỷ lệ mỡ cơ thể hợp lệ (2–70%) để tính BMR/TDEE.':'Nhập đủ giới tính, năm sinh, chiều cao và cân nặng để tính BMR/TDEE.')+'</div>';
if(ms>0)h+=`<p>Macro đã đặt = <b>${fmt(ms)} kcal</b> (P×4 + C×4 + F×9)</p>`+(tg>0&&Math.abs(ms-tg)>tg*.05?`<div class="warn">Tổng kcal từ macro ${ms>tg?'cao hơn':'thấp hơn'} mục tiêu ${fmt(Math.abs(ms-tg))} kcal. Bạn có thể chỉnh macro hoặc nhấn "Gợi ý macro". App không tự đổi số của bạn.</div>`:'');return h}
const refreshCalc=()=>{const c=$('#pc');if(c)c.innerHTML=calcBox()};
const opt=(v,c,t)=>`<option value="${v}" ${c?'selected':''}>${t}</option>`;

return `<div class="card"><h3>Thông tin cơ thể</h3><label>Giới tính</label><select onchange="setP('sex',this.value)">${opt('m',p.sex=='m','Nam')}${opt('f',p.sex=='f','Nữ')}</select><label>Năm sinh</label><input inputmode="numeric" value="${p.dob}" placeholder="Ví dụ: 1994" onchange="setP('dob',this.value)"><p class="mu">Tuổi hiện tại: ${isFinite(age(p.dob))?age(p.dob)+' tuổi':'chưa xác định'}</p>

function exportD(){const b=new Blob([JSON.stringify({app:'MyCal',exported:new Date().toISOString(),data:S})],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mycal-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();toast('Đã xuất file sao lưu')}
function importD(el){const f=el.files[0];el.value='';if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result),d=j.data||j,o=x=>x&&typeof x=='object'&&!Array.isArray(x);if(!(d.v==1&&o(d.p)&&o(d.log)&&o(d.steps)&&o(d.wk)&&o(d.wt)&&Array.isArray(d.foods)))throw 0;
